<head>
<meta charset="utf-8">

<body style="margin:0">
<title>Spelling Hawks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Class theme: sky blue + hawk rust + gold. Token names kept from the original page (violet = primary, pink = accent). */
:root{
  --bg:#EEF4FB; --surface:#FFFFFF; --surface-2:#E3EDF8; --ink:#16263D; --ink-soft:#56677F;
  --violet:#2563C9; --violet-deep:#1A469A; --pink:#E2683C; --pink-deep:#B84A22;
  --sun:#F5B82E; --sun-deep:#C98E0A; --sun-ink:#3A2A00;
  --mint:#2FB57E; --mint-deep:#1E8F60; --coral:#F07A57; --coral-deep:#D2553A; --sky:#5DB8F0;
  --line:#CCDAEB; --shadow:0 10px 30px rgba(22,52,110,.12); --on-accent:#FFFFFF;
  --dots:rgba(37,99,201,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme:dark;
    --bg:#0F1A2B; --surface:#19283F; --surface-2:#22355A; --ink:#EEF4FF; --ink-soft:#A9B8CF;
    --violet:#6E9BF0; --violet-deep:#3F6FD0; --pink:#F08A5E; --pink-deep:#C9653A;
    --sun:#F7C64F; --sun-deep:#CC9A17; --mint:#3ECF92; --mint-deep:#25A672; --coral:#FF8A6B; --coral-deep:#E2664A;
    --line:#33496B; --shadow:0 10px 30px rgba(0,0,0,.35); --dots:rgba(110,155,240,.10);
  }
}
:root[data-theme="dark"]{ color-scheme:dark;
  --bg:#0F1A2B; --surface:#19283F; --surface-2:#22355A; --ink:#EEF4FF; --ink-soft:#A9B8CF;
  --violet:#6E9BF0; --violet-deep:#3F6FD0; --pink:#F08A5E; --pink-deep:#C9653A;
  --sun:#F7C64F; --sun-deep:#CC9A17; --mint:#3ECF92; --mint-deep:#25A672; --coral:#FF8A6B; --coral-deep:#E2664A;
  --line:#33496B; --shadow:0 10px 30px rgba(0,0,0,.35); --dots:rgba(110,155,240,.10);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg) radial-gradient(var(--dots) 1.6px, transparent 1.7px) 0 0/22px 22px;color:var(--ink);
  font-family:Nunito,"Segoe UI",system-ui,sans-serif;font-size:17px;line-height:1.4;-webkit-tap-highlight-color:transparent}
#app{max-width:640px;margin:0 auto;padding-block:12px 32px;padding-inline:16px;min-height:100%}
h1,h2,h3{font-family:Fredoka,Nunito,sans-serif;font-weight:700;line-height:1.15;margin:0;text-wrap:balance}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.eyebrow{font-family:Fredoka,sans-serif;font-weight:600;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}

/* chunky buttons */
.btn{font-family:Fredoka,sans-serif;font-weight:600;font-size:1.1rem;border:0;border-radius:18px;padding:12px 20px;min-height:56px;
  cursor:pointer;color:var(--on-accent);background:var(--violet);box-shadow:0 6px 0 var(--violet-deep);
  transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--violet-deep)}
.btn.pink{background:var(--pink);box-shadow:0 6px 0 var(--pink-deep)} .btn.pink:active{box-shadow:0 2px 0 var(--pink-deep)}
.btn.mint{background:var(--mint);box-shadow:0 6px 0 var(--mint-deep)} .btn.mint:active{box-shadow:0 2px 0 var(--mint-deep)}
.btn.sun{background:var(--sun);box-shadow:0 6px 0 var(--sun-deep);color:var(--sun-ink)} .btn.sun:active{box-shadow:0 2px 0 var(--sun-deep)}
.btn.ghost{background:var(--surface-2);color:var(--ink);box-shadow:0 6px 0 var(--line)} .btn.ghost:active{box-shadow:0 2px 0 var(--line)}
.btn.big{width:100%;font-size:1.3rem;min-height:66px;border-radius:22px}
.btn.sm{min-height:44px;padding:8px 14px;font-size:1rem;border-radius:14px;box-shadow:0 4px 0 var(--violet-deep)}
.btn.sm.ghost{box-shadow:0 4px 0 var(--line)} .btn.sm.pink{box-shadow:0 4px 0 var(--pink-deep)} .btn.sm.mint{box-shadow:0 4px 0 var(--mint-deep)} .btn.sm.sun{box-shadow:0 4px 0 var(--sun-deep)}
.btn.sm:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn[disabled]{opacity:.5;cursor:default;transform:none}
.btn[hidden]{display:none}
.iconbtn{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;font-size:1.3rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.center{justify-content:center}
.stack{display:flex;flex-direction:column;gap:12px}

/* home */
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.top .mascot{width:76px;flex:0 0 auto}
.top h1{font-size:1.7rem}
.top .sub{margin:2px 0 0;color:var(--ink-soft);font-weight:700}
.card{background:var(--surface);border:2px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:18px}
.hero{background:linear-gradient(135deg,var(--surface) 0%,var(--surface-2) 100%);border-color:var(--violet)}
.hero h2{font-size:1.5rem;margin-top:2px}
.hero .meta{color:var(--ink-soft);font-weight:700;margin:4px 0 10px}
.bar{height:14px;border-radius:99px;background:var(--surface-2);border:2px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--pink));border-radius:99px;transition:width .5s}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-weight:800;cursor:pointer;min-height:42px}
.chip[aria-pressed="true"]{background:var(--violet);border-color:var(--violet);color:var(--on-accent)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.actions{grid-template-columns:1fr}}
details.words{margin-top:12px} details.words summary{cursor:pointer;font-weight:800;color:var(--violet)}
.wordgrid{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.wtag{font-family:Andika,sans-serif;background:var(--surface-2);border-radius:10px;padding:4px 10px;font-weight:700}
.wtag.m{background:var(--sun);color:var(--sun-ink)} .wtag.t{background:var(--coral);color:#fff}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
@media (max-width:420px){.twocol{grid-template-columns:1fr}}
.deck{display:flex;flex-direction:column;gap:8px}
.deck .t{font-family:Fredoka,sans-serif;font-weight:700;font-size:1.15rem}
.deck .m{color:var(--ink-soft);font-weight:700;font-size:.95rem}
.older{margin-top:18px}
.older h3{font-size:1.2rem;margin-bottom:8px}
.wk{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:2px solid var(--line)}
.wk .t{font-weight:800} .wk .m{color:var(--ink-soft);font-size:.92rem;font-weight:700}
.wk .bar{margin-top:6px;height:10px}
.foot{margin-top:22px;text-align:center}
.linkbtn{background:none;border:0;color:var(--ink-soft);font-weight:800;text-decoration:underline;cursor:pointer;padding:10px;min-height:44px}

/* session */
.sbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sbar .pips{flex:1;display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.pip{width:12px;height:12px;border-radius:50%;background:var(--line)}
.pip.now{background:var(--violet);transform:scale(1.25)} .pip.ok{background:var(--mint)} .pip.no{background:var(--coral)}
.sbar .stars{font-weight:800;white-space:nowrap}
.stage{perspective:1400px}
.flip{display:grid;transition:transform .55s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d}
.flip.flipped{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg)}
.face.card{padding:20px 18px 22px}
@media (prefers-reduced-motion:reduce){.flip{transition:none}}
.word{font-family:Andika,sans-serif;font-weight:700;font-size:clamp(2.4rem,11vw,4rem);text-align:center;letter-spacing:.03em;margin:8px 0 14px;overflow-wrap:anywhere}
.sentence{font-family:Andika,sans-serif;font-size:clamp(1.25rem,5vw,1.6rem);font-weight:400;text-align:center;line-height:1.5;margin:10px 0 14px}
.sentence .blank{display:inline-block;min-width:4.5em;border-bottom:4px solid var(--violet);padding:0 6px;color:var(--violet);font-weight:700;text-align:center;vertical-align:baseline}
.sentence .blank.filled{color:var(--ink)}
.face .eyebrow{text-align:center}
.hintbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0 12px}
.inputArea{margin:6px 0 10px}
.typein{font-family:Andika,sans-serif;font-size:2.1rem;font-weight:700;text-align:center;width:100%;border:3px solid var(--line);border-radius:18px;padding:10px 12px;background:var(--surface-2);color:var(--ink);letter-spacing:.06em}
.typein:focus{border-color:var(--violet);outline:none}
.boxes{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.box{width:68px;height:82px;border:3px solid var(--line);border-radius:14px;background:var(--surface-2);position:relative;touch-action:none;overflow:hidden}
@media (min-width:520px){.box{width:76px;height:90px}}
.box::before{content:"";position:absolute;left:8px;right:8px;top:48%;border-top:2px dashed var(--line);pointer-events:none}
.box::after{content:"";position:absolute;left:8px;right:8px;top:78%;border-top:2px solid var(--line);pointer-events:none}
.box canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
.box .guess{position:absolute;right:5px;bottom:1px;font-family:Andika,sans-serif;font-weight:700;font-size:1rem;color:var(--violet);pointer-events:none}
.box .guess.soft{opacity:.6}
.box.filled{border-color:var(--violet)}
.box .erase{position:absolute;left:2px;top:2px;width:26px;height:26px;border-radius:50%;border:0;background:var(--coral);color:#fff;font-weight:900;line-height:1;display:none;cursor:pointer;font-size:.9rem}
.box.filled .erase{display:block}
.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.slot{width:54px;height:62px;border:3px dashed var(--line);border-radius:12px;display:grid;place-items:center;font-family:Andika,sans-serif;font-weight:700;font-size:1.9rem;background:transparent;cursor:pointer;color:var(--ink)}
.slot.filled{border-style:solid;border-color:var(--violet);background:var(--surface-2)}
.slot.over{border-color:var(--mint);background:var(--surface-2)}
.tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px;min-height:70px;padding:8px;border-radius:16px;background:var(--surface-2)}
.tile{width:56px;height:64px;border:0;border-radius:14px;background:var(--sun);box-shadow:0 5px 0 var(--sun-deep);font-family:Andika,sans-serif;font-weight:700;font-size:1.9rem;color:var(--sun-ink);display:grid;place-items:center;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.tile:active{cursor:grabbing}
.tile.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-50%) scale(1.1);opacity:.95}
.tile.dragging{opacity:.3}
.fb{min-height:2.6rem;text-align:center;font-weight:800;font-size:1.15rem;margin:6px 0 10px}
.fb .ok{color:var(--mint-deep)} .fb .no{color:var(--coral-deep)}
.marks{font-family:Andika,sans-serif;font-size:1.7rem;letter-spacing:.08em;margin:4px 0}
.mark.yes{color:var(--mint-deep)} .mark.no{color:var(--coral-deep);text-decoration:underline wavy}
.reveal{font-family:Andika,sans-serif;font-size:2rem;font-weight:700;color:var(--violet);letter-spacing:.06em}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.mode{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 6px;min-height:58px;font-family:Fredoka,sans-serif;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.95rem}
.mode span{font-size:1.4rem;line-height:1}
.mode[aria-pressed="true"]{border-color:var(--violet);background:var(--surface-2);color:var(--violet)}
.shake{animation:shake .5s} @keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}
.pop{animation:pop .45s} @keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.mascot.happy{animation:bounce .7s ease 2} @keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-16px) rotate(-6deg)}70%{transform:translateY(-4px) rotate(4deg)}}
.mascot.sad{animation:wiggle .6s} @keyframes wiggle{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@media (prefers-reduced-motion:reduce){.shake,.pop,.mascot.happy,.mascot.sad{animation:none}}
.bigmascot{width:110px;margin:0 auto 6px;display:block}
/* word bank (fill-in-the-sentence cards) */
.bank{display:flex;flex-wrap:wrap;gap:10px 8px;justify-content:center;margin:4px 0 2px}
.chip{font-family:Andika,sans-serif;font-weight:700;font-size:clamp(1.25rem,5.2vw,1.55rem);min-height:54px;min-width:72px;padding:4px 14px;border-radius:16px;border:3px solid var(--line);
  background:var(--surface-2);color:var(--ink);cursor:pointer;box-shadow:0 5px 0 var(--line);transition:transform .08s,box-shadow .08s}
.chip:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.chip.wrong{opacity:.4;text-decoration:line-through;text-decoration-color:var(--coral-deep);box-shadow:none;transform:none;cursor:default}
.chip.right{background:var(--mint);border-color:var(--mint-deep);color:#fff;box-shadow:0 5px 0 var(--mint-deep)}
.chip.hint{border-color:var(--sun-deep);background:var(--sun);color:var(--sun-ink);animation:pop .6s 3}
@media (prefers-reduced-motion:reduce){.chip.hint{animation:none}}
/* hawk mascot (fills the space under the card) */
.hawkZone{position:relative;display:flex;justify-content:center;align-items:flex-end;margin-top:10px;pointer-events:none}
.hawk{height:clamp(190px,40vh,420px);width:auto;overflow:visible}
@media (max-height:600px){.hawkZone{display:none}}
.hawk *{transform-box:view-box}
.hawk .hbody{transform-origin:110px 150px;animation:hhover 2.4s ease-in-out infinite}
@keyframes hhover{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.hawk .hshadow{transform-origin:110px 252px;animation:hshadow 2.4s ease-in-out infinite}
@keyframes hshadow{0%,100%{transform:scaleX(1);opacity:.2}50%{transform:scaleX(.8);opacity:.12}}
.hawk .wingL{transform-origin:92px 124px;animation:hwingL .6s ease-in-out infinite alternate}
.hawk .wingR{transform-origin:128px 124px;animation:hwingR .6s ease-in-out infinite alternate}
@keyframes hwingL{from{transform:rotate(-8deg)}to{transform:rotate(14deg)}}
@keyframes hwingR{from{transform:rotate(8deg)}to{transform:rotate(-14deg)}}
.hawk .hhead{transform-origin:110px 112px}
.hawk .eyes{transform-origin:110px 82px;animation:hblink 5s infinite}
@keyframes hblink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.hawk .spark{transform-origin:center;transform-box:fill-box;animation:htwinkle 1.8s ease-in-out infinite}
@keyframes htwinkle{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
.hawk .badgeStar{transform-origin:center;transform-box:fill-box;animation:hglow 1.6s ease-in-out infinite}
@keyframes hglow{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.15) rotate(18deg)}}
.hawk .burst{opacity:0;transform-origin:110px 142px}
.hawk.cheer .hbody{animation:hcheer 1.3s ease-in-out}
@keyframes hcheer{0%{transform:translateY(0)}30%{transform:translateY(-36px) rotate(-5deg)}55%{transform:translateY(-40px) rotate(5deg)}100%{transform:translateY(0)}}
.hawk.cheer .wingL{animation:hwingL .15s ease-in-out 8 alternate}
.hawk.cheer .wingR{animation:hwingR .15s ease-in-out 8 alternate}
.hawk.cheer .burst{animation:hburst 1.1s ease-out .15s}
@keyframes hburst{0%{opacity:0;transform:scale(.2)}25%{opacity:1}100%{opacity:0;transform:scale(1.7)}}
.hawk.oops .hhead{animation:hoops .9s ease-in-out}
@keyframes hoops{20%{transform:rotate(-10deg)}45%{transform:rotate(8deg)}70%{transform:rotate(-4deg)}100%{transform:rotate(0)}}
.fsay{position:absolute;top:0;left:50%;transform:translate(-50%,-30%) scale(.6);opacity:0;background:var(--surface);color:var(--violet-deep);border:2px solid var(--line);
  border-radius:16px;padding:6px 14px;font-family:Fredoka,sans-serif;font-weight:600;font-size:1.05rem;white-space:nowrap;box-shadow:var(--shadow);transition:opacity .25s,transform .25s}
.fsay.show{opacity:1;transform:translate(-50%,-30%) scale(1)}
@media (prefers-reduced-motion:reduce){.hawk *,.hawk.cheer *,.hawk.oops *{animation:none!important}.hawk .burst{opacity:0}}
/* first-visit name card */
.welcome{text-align:center;margin-top:24px}
.welcome h2{font-size:1.7rem;margin:4px 0 6px}
.welcome .typein{margin:12px 0 14px;font-size:1.8rem}
.done h2{text-align:center;font-size:1.8rem}
.done .stat{text-align:center;font-weight:800;font-size:1.15rem;color:var(--ink-soft)}
.done .missed{margin:10px 0}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:14px;font-weight:800;z-index:60;box-shadow:var(--shadow);max-width:90vw;text-align:center}

/* sheet */
.sheet{position:fixed;inset:0;background:rgba(20,10,40,.45);z-index:70;display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--surface);width:min(640px,100%);max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px 28px;border-top:2px solid var(--line)}
.sheet h2{font-size:1.4rem;margin-bottom:8px}
.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.field label{font-weight:800}
.field input,.field textarea{font:inherit;border:2px solid var(--line);border-radius:12px;padding:10px;background:var(--surface-2);color:var(--ink);width:100%}
.field textarea{min-height:90px;font-family:Andika,sans-serif}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:2px solid var(--line);font-weight:800}
.switch button{min-width:74px}
.note{color:var(--ink-soft);font-size:.95rem;margin:6px 0}
.sr{position:absolute;left:-9999px}
</style>

<div id="app" role="application" aria-label="Spelling Hawks"></div>

<script>

  { id: "2026-10-19", test: "2026-10-23", words: ["held","church","once","one","own","before","know","no","were","where","there","here","dead","leave","early","close","flower","flour","nothing","ground","lead","led","such","morning","however"] },
  { id: "2026-10-05", test: "2026-10-09", words: ["March","march","next","indeed","four","herself","power","wish","because","cause","world","country","meet","meat","another","tripped","trip","list","people","ever"] },

/* ---------- inputs ---------- */
function buildInput() {

  area.innerHTML = '';

/* Word bank: the answer plus 4 others from this session (falling back to every week). Up to 2 are look-alikes

function editDist(a, b) {

function bankChoices(word) {

  S.round.concat(S.queue).forEach(add(session)); allWords().forEach(add(other));
  var pool = shuffle(session).concat(shuffle(other));
  var near = shuffle(pool.filter(function (w) { var k = w.toLowerCase(); return editDist(k, t) <= 2 || k.slice(0, 3) === t.slice(0, 3) || k.indexOf(t) >= 0 || t.indexOf(k) >= 0; }))
    .sort(function (a, b) { return editDist(a.toLowerCase(), t) - editDist(b.toLowerCase(), t); }).slice(0, 2);

}
function buildBank(area) {

  $$('.chip', area).forEach(function (b) {

    });

}
function buildType(area) {
  var inp = h('<input class="typein" id="typein" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="text" enterkeyhint="done" aria-label="Type the word" placeholder="type here">');

}
function buildWrite(area) {
  var wrap = h('<div><div class="eyebrow" style="margin-bottom:8px">Write one letter in each box</div><div class="boxes" id="boxes"></div><div class="row center" style="margin-top:10px"><button class="btn sm ghost" id="clearAll">🧽 Clear all</button></div></div>');
  area.appendChild(wrap);
  var boxesEl = $('#boxes', wrap);
  W.target.split('').forEach(function (ch, i) { boxesEl.appendChild(makeBox(i, ch)); });
  $('#clearAll', wrap).addEventListener('click', function () { W.boxes.forEach(function (b) { b.clear(); }); });
  W.get = function () { return W.boxes.map(function (b) { return b.strokes.length ? (b.letter || '?') : ''; }).join(''); };
  W.reset = function () { W.boxes.forEach(function (b) { b.clear(); }); };
  W.pending = function () { return W.boxes.some(function (b) { return b.timer; }); };
}
function makeBox(i, expected) {
  var box = h('<div class="box"><canvas aria-label="Letter ' + (i + 1) + '"></canvas><span class="guess"></span><button class="erase" aria-label="Erase letter ' + (i + 1) + '">×</button></div>');
  var cv = box.querySelector('canvas'), ctx = cv.getContext('2d'), guess = box.querySelector('.guess');
  var st = { strokes: [], letter: '', sure: true, cur: null, timer: 0 };
  function strokeColor() { return getComputedStyle(document.documentElement).getPropertyValue('--violet').trim() || '#7C4DFF'; }
  function size() { var r = box.getBoundingClientRect(); var dpr = window.devicePixelRatio || 1; cv.width = Math.max(1, r.width * dpr); cv.height = Math.max(1, r.height * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); redraw(); }
  function pen() { ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = strokeColor(); }
  function redraw() { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height); ctx.restore(); pen(); st.strokes.forEach(function (s) { ctx.beginPath(); ctx.moveTo(s[0].x, s[0].y); for (var k = 1; k < s.length; k++) ctx.lineTo(s[k].x, s[k].y); if (s.length === 1) ctx.lineTo(s[0].x + 0.1, s[0].y + 0.1); ctx.stroke(); }); }
  function pt(e) { var r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  function recognizeLater() { clearTimeout(st.timer); st.timer = setTimeout(function () { st.timer = 0; if (!st.strokes.length) { st.letter = ''; guess.textContent = ''; return; } var r = Recog.read(st.strokes, expected); st.letter = r.letter; st.sure = r.sure; guess.textContent = r.letter; guess.classList.toggle('soft', !r.sure); if (S.mode === 'sentence') renderSentenceLine(W.get()); }, 420); }
  cv.addEventListener('pointerdown', function (e) { e.preventDefault(); cv.setPointerCapture(e.pointerId); audio(); st.cur = [pt(e)]; pen(); ctx.beginPath(); ctx.moveTo(st.cur[0].x, st.cur[0].y); });
  cv.addEventListener('pointermove', function (e) { if (!st.cur) return; var p = pt(e); st.cur.push(p); ctx.lineTo(p.x, p.y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(p.x, p.y); });

}
function buildTiles(area) {
  var letters = W.target.split('');
  var alphabet = 'abcdefghijklmnopqrstuvwxyz'.split('').filter(function (c) { return letters.indexOf(c) < 0; });
  var nDis = Math.min(3, Math.max(2, Math.round(letters.length / 3)));
  var tiles = shuffle(letters.concat(shuffle(alphabet).slice(0, nDis))).map(function (ch, i) { return { id: i, ch: ch, slot: -1 }; });
  var slots = letters.map(function () { return -1; });
  var wrap = h('<div><div class="eyebrow" style="margin-bottom:8px">Tap or drag the letters into the boxes</div><div class="slots" id="slots"></div><div class="tray" id="tray"></div></div>');
  area.appendChild(wrap);
  var slotsEl = $('#slots', wrap), trayEl = $('#tray', wrap);
  function render() {
    slotsEl.innerHTML = ''; trayEl.innerHTML = '';
    slots.forEach(function (tid, i) {
      var s = h('<button class="slot' + (tid >= 0 ? ' filled' : '') + '" data-slot="' + i + '" aria-label="Box ' + (i + 1) + (tid >= 0 ? ', letter ' + tiles[tid].ch : ', empty') + '">' + (tid >= 0 ? tiles[tid].ch : '') + '</button>');
      s.addEventListener('click', function () { if (slots[i] >= 0) { tiles[slots[i]].slot = -1; slots[i] = -1; sfx.pop(); render(); } });
      slotsEl.appendChild(s);
    });
    tiles.filter(function (t) { return t.slot < 0; }).forEach(function (t) {
      var el = h('<button class="tile" data-tile="' + t.id + '" aria-label="Letter ' + t.ch + '">' + t.ch + '</button>');
      attachDrag(el, t); trayEl.appendChild(el);
    });
    renderSentenceLine(W.get());
  }
  function place(t, i) { if (i < 0) return; if (slots[i] >= 0) tiles[slots[i]].slot = -1; t.slot = i; slots[i] = t.id; sfx.pop(); render(); }
  function firstEmpty() { return slots.indexOf(-1); }
  function attachDrag(el, t) {
    var start = null, ghost = null, moved = false;
    el.addEventListener('pointerdown', function (e) { start = { x: e.clientX, y: e.clientY }; moved = false; el.setPointerCapture(e.pointerId); audio(); });
    el.addEventListener('pointermove', function (e) {
      if (!start) return;
      if (!moved && Math.hypot(e.clientX - start.x, e.clientY - start.y) > 8) { moved = true; ghost = el.cloneNode(true); ghost.classList.add('ghost'); document.body.appendChild(ghost); el.classList.add('dragging'); }
      if (moved) { ghost.style.left = e.clientX + 'px'; ghost.style.top = e.clientY + 'px'; var over = slotUnder(e.clientX, e.clientY); $$('.slot', slotsEl).forEach(function (s) { s.classList.toggle('over', s === over); }); }
    });
    function end(e) {
      if (!start) return; start = null;
      if (moved) { var over = slotUnder(e.clientX, e.clientY); if (ghost) ghost.remove(); ghost = null; el.classList.remove('dragging'); $$('.slot', slotsEl).forEach(function (s) { s.classList.remove('over'); }); if (over) place(t, +over.dataset.slot); }

  W.reset = function () { tiles.forEach(function (t) { t.slot = -1; }); slots = slots.map(function () { return -1; }); render(); };
}

/* ---------- checking ---------- */
function lcsMarks(attempt, target) {
  var a = attempt.toLowerCase(), b = target.toLowerCase(), m = a.length, n = b.length, i, j;
  var dp = []; for (i = 0; i <= m; i++) { dp.push([]); for (j = 0; j <= n; j++) dp[i].push(0); }
  for (i = m - 1; i >= 0; i--) for (j = n - 1; j >= 0; j--) dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  var marks = []; i = 0; j = 0;
  while (i < m && j < n) { if (a[i] === b[j]) { marks.push({ ch: attempt[i], ok: true }); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) { marks.push({ ch: attempt[i], ok: false }); i++; } else j++; }
  while (i < m) marks.push({ ch: attempt[i++], ok: false });

}
function check() {
  if (!W || W.done) return;

  var ans = W.get(), fb = $('#fb');
  if (!ans.length) { fb.innerHTML = '<span class="no">' + (currentInput() === 'type' ? 'Type the word first!' : 'Fill in the boxes first!') + '</span>'; return; }
  if (currentInput() !== 'type' && ans.replace(/\?/g, '').length < W.target.length) { fb.innerHTML = '<span class="no">Fill in every box first!</span>'; return; }
  if (ans.toLowerCase() === W.target) onCorrect(); else onWrong(ans);
}
function onCorrect() {
  W.done = true;
  var first = W.misses === 0 && !W.peeked;
  var p = prog(W.word);
  if (first) { p.ok++; p.streak++; S.stars++; store.stars++; } else { p.ok++; p.miss++; p.streak = 0; }
  p.last = Date.now(); setProg(W.word, p); save();
  S.results[S.idx] = first;
  var fb = $('#fb');
  fb.innerHTML = '<span class="ok">🎉 ' + esc(praise()) + (first ? ' ⭐' : ' 👍') + '</span><div class="reveal">' + esc(W.word) + '</div>';
  $('.stars').textContent = '⭐ ' + S.stars;
  $$('.pip')[S.idx].className = 'pip ' + (first ? 'ok' : 'no');
  sfx.correct(); if (first) setTimeout(sfx.star, 500);
  hawkReact('cheer'); setTimeout(function () { confetti(wandOrigin()); }, 150); mascotReact('happy');
  hush(); say(pick(['Yes!', 'You got it!', 'Great job!']), 1);
  if (S.mode === 'sentence') saySentence(W.word, false); else { spellOut(W.word); say(W.word, 0.85); }
  var stage = $('.stage'); stage.classList.remove('pop'); void stage.offsetWidth; stage.classList.add('pop');
  var chk = $('#check'); chk.textContent = 'Next ➔'; chk.className = 'btn big'; chk.hidden = false;
  chk.onclick = nextWord;
  W.auto = setTimeout(nextWord, 3800);
}
function onWrong(ans) {
  W.misses++;
  S.results[S.idx] = false; $$('.pip')[S.idx].className = 'pip now';
  sfx.wrong(); mascotReact('sad'); hawkReact('oops');
  var card = $('.stage'); card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
  var fb = $('#fb');
  if (S.mode === 'sentence') {
    // Word bank: never say the answer aloud — she should find it by reading. Re-read the sentence with "blank" instead.
    var bh = '<span class="no">Not that one. Read the sentence again!</span>';
    if (W.misses === 2) bh += '<div class="row center" style="margin-top:6px"><button class="btn sm sun" id="showme">👀 Show me</button></div>';
    fb.innerHTML = bh;
    var bsm = $('#showme'); if (bsm) bsm.addEventListener('click', function () { flashWord(); });
    if (W.misses >= 3) $$('.chip').forEach(function (c) { if (c.dataset.w.toLowerCase() === W.target) c.classList.add('hint'); });
    hush(); say(pick(['Not that one. Try again!', 'Hmm, not quite. Try again!']), 1); saySentence(W.word, true);
    setTimeout(function () { if (W.reset) W.reset(); }, 900);

  }

  var html = '<span class="no">' + esc(pick(RETRY)) + '</span><div class="marks">' + marks + '</div><div class="note">' + (W.misses >= 3 ? 'Copy it: <span class="reveal">' + esc(W.word) + '</span>' : 'The word has ' + W.target.length + ' letters.') + '</div>';
  if (W.misses === 2) html += '<div class="row center" style="margin-top:6px"><button class="btn sm sun" id="showme">👀 Show me</button></div>';

function nextWord() {

}
